name: Test clinic application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test PostgreSQL and HTTPS API flow
        env:
          TEST_DATABASE_URL: postgresql://clinic_test:disposable_test_password@localhost:5432/clinic_test
        run: python -m unittest discover -s tests -v
